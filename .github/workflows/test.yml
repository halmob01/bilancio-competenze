name: Test bilancio
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controllo sintattico JavaScript
        run: |
          node --check js/config.js
          node --check js/dati.js
          node --check js/bilancio.js
          node --check js/cv.js
          node --check js/docx.js
          node --check js/pdf.js
          node --check js/app.js
          node --check cv/js/app.js
          node --check diario/js/diario.js
          node --check diario/js/app.js
      - name: Test logica e contenuti
        run: node --test tests/*.test.cjs
