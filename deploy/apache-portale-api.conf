# Portale dello studente — inoltro di /…/api/ al programma Node (SOLO FASE DI PROVA, dati finti).
#
# Va in /etc/apache2/portale/portale-api.conf e si richiama con UNA riga dentro il blocco
# <VirtualHost *:443> già esistente (quello con il certificato Let's Encrypt):
#     Include /etc/apache2/portale/portale-api.conf
# Non va messo in conf-enabled: varrebbe anche per la porta 80 e l'API risponderebbe senza HTTPS.
#
# Sostituire PERCORSO con la cartella dei siti sotto /var/www/html (per esempio catalfamo/portale).
# Richiede: a2enmod proxy proxy_http (vedi deploy/LEGGIMI.md, passo 5).
#
# Per i dati veri si usa invece un nome di dominio solo per il portale: deploy/apache-portale-vhost.conf.

ProxyRequests Off
ProxyPass        "/PERCORSO/api/" "http://127.0.0.1:3100/api/" timeout=30 retry=0
ProxyPassReverse "/PERCORSO/api/" "http://127.0.0.1:3100/api/"

<Location "/PERCORSO/api/">
    # 2 MB: un documento (1 MB) o una foto (400 KB) con margine.
    LimitRequestBody 2097152
</Location>
