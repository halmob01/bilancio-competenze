name: Test bilancio
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controllo sintattico JavaScript
        run: |
          node --check js/config.js
          node --check js/dati.js
          node --check js/bilancio.js
          node --check js/cv.js
          node --check js/docx.js
          node --check js/pdf.js
          node --check js/app.js
          node --check cv/js/app.js
          node --check diario/js/diario.js
          node --check diario/js/app.js
          node --check js/competenze.js
          node --check js/unione.js
          node --check js/archivio.js
          node --check js/area.js
          node --check portfolio/js/attivita.js
          node --check portfolio/js/foto.js
          node --check portfolio/js/file.js
          node --check portfolio/js/app.js
          node --check docenti/js/docenti.js
          node --check docenti/js/app.js
          for f in server/*.js; do node --check "$f"; done
          bash -n deploy/installa-portale.sh
          bash -n deploy/prepara-siti.sh
      - name: Test logica e contenuti
        run: node --test tests/*.test.cjs
