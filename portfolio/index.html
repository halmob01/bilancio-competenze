<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le mie attività</title>
  <meta name="description" content="Le mie attività: fotografa quello che fai in laboratorio e in tirocinio e scrivi due righe. Il tuo portfolio, con le tue parole.">
  <meta name="theme-color" content="#CC0000">
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
  <link rel="apple-touch-icon" href="../img/favicon-180.png">
  <link rel="preload" href="../fonts/fira-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../fonts/fira-sans-latin-900-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/tokens.css?v=20261126-d">
  <link rel="stylesheet" href="../css/stile.css?v=20261126-d">
  <script src="../js/config.js" defer></script>
  <script src="../js/unione.js" defer></script>
  <script src="../js/archivio.js" defer></script>
  <script src="../js/dati.js" defer></script>
  <script src="../js/bilancio.js" defer></script>
  <script src="../js/competenze.js" defer></script>
  <script src="../js/pdf.js" defer></script>
  <script src="js/attivita.js" defer></script>
  <script src="js/foto.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="salta" href="#principale">Vai al contenuto</a>

  <header class="testata">
    <div class="testata__riga">
      <a class="testata__tutti" href="../">Tutti i percorsi</a>
      <button type="button" class="testata__nome" id="vai-home">Le mie attività</button>
      <span class="meta testata__salvato" id="salvato" role="status" aria-live="polite"></span>
      <button type="button" class="pulsante pulsante--secondario pulsante--piccolo" id="apri-salva">Salva e scarica</button>
    </div>
    <div class="tappa-mobile" id="tappa-mobile" hidden>
      <button type="button" class="pulsante pulsante--secondario pulsante--piccolo" id="apri-indice">Indice</button>
      <span class="meta" id="tappa-nome"></span>
      <span class="meta" id="tappa-stato"></span>
    </div>
  </header>
  <div class="avanzamento" id="avanzamento" hidden aria-label="Avanzamento dell'attività"><div class="avanzamento__barra" id="barra"></div></div>

  <main id="principale" tabindex="-1"></main>

  <dialog id="dialogo-salva" aria-labelledby="dialogo-salva-titolo">
    <h2 id="dialogo-salva-titolo">Salva e scarica</h2>
    <p>Le attività e le foto sono salvate solo su questo dispositivo, in questo browser. Per riprenderle su un altro dispositivo scarica una copia e poi caricala da lì: la copia contiene anche le foto.</p>
    <div class="dialogo__azioni">
      <button type="button" class="pulsante" id="scarica-pdf">Scarica in PDF</button>
      <button type="button" class="pulsante pulsante--secondario" id="scarica">Scarica una copia</button>
      <button type="button" class="pulsante pulsante--secondario" id="carica">Carica una copia</button>
    </div>
    <div class="dialogo__azioni">
      <button type="button" class="pulsante pulsante--secondario pulsante--piccolo" id="cancella">Cancella tutte le attività</button>
      <button type="button" class="pulsante pulsante--testo" id="chiudi-salva">Chiudi</button>
    </div>
    <input type="file" id="file-copia" accept="application/json,.json" hidden>
  </dialog>

  <dialog id="dialogo-indice" class="indice-dialogo" aria-labelledby="dialogo-indice-titolo">
    <h2 id="dialogo-indice-titolo">Indice</h2>
    <ol id="indice-elenco"></ol>
    <button type="button" class="pulsante pulsante--testo" id="chiudi-indice">Chiudi</button>
  </dialog>

  <dialog id="dialogo-messaggio" aria-labelledby="messaggio-testo">
    <p id="messaggio-testo"></p>
    <div class="dialogo__azioni">
      <button type="button" class="pulsante pulsante--secondario" id="messaggio-annulla">Annulla</button>
      <button type="button" class="pulsante" id="messaggio-ok">Va bene</button>
    </div>
  </dialog>

  <noscript><p style="padding:20px">Per raccogliere le tue attività serve JavaScript attivo nel browser.</p></noscript>
</body>
</html>
